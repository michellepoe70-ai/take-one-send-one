<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Drafts | Take One, Send One</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/drafts.js" defer></script>
  </head>
  <body>
    <header>
      <a class="brand" href="/">Take One, Send One<span>Tidepath Family Alliance</span></a>
      <nav aria-label="Main navigation"><a href="/">New note</a><a href="/drafts" aria-current="page">Drafts</a></nav>
    </header>
    <main>
      <p class="eyebrow">Local prototype · Fictional notes only</p>
      <div class="heading-row"><div><h1>Drafts</h1><p class="intro">Continue a saved session note.</p></div><a class="button" href="/">New note</a></div>
      <p id="status" class="status" role="status" aria-live="polite">Loading drafts…</p>
      <section id="empty-state" class="panel" hidden><h2>No drafts yet</h2><p>Save your first session note to see it here.</p><a href="/">Write a note</a></section>
      <ul id="draft-list" class="draft-list" aria-label="Saved drafts"></ul>
    </main>
  </body>
</html>
