<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Counseling notes | Tidepath Family Alliance</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #173c3c; background: #f6f7f3; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      header { padding: 24px max(24px, calc((100vw - 960px) / 2)); border-bottom: 1px solid #d9e1dc; background: #fff; }
      header p { margin: 0; font-weight: 650; }
      main { max-width: 720px; margin: 88px auto; padding: 0 24px; }
      .label { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #476c61; }
      h1 { font-size: clamp(32px, 6vw, 48px); line-height: 1.15; letter-spacing: -.035em; margin: 16px 0; }
      .intro { font-size: 20px; line-height: 1.6; color: #476260; }
      section { margin-top: 36px; padding: 28px; background: #fff; border: 1px solid #d9e1dc; border-radius: 12px; }
      h2 { margin: 0 0 12px; font-size: 21px; }
      section p { line-height: 1.6; color: #476260; margin: 0 0 20px; }
      a { display: inline-block; padding: 12px 18px; background: #20594d; color: #fff; border-radius: 6px; text-decoration: none; font-weight: 600; }
      a:hover { background: #164337; }
      a:focus-visible { outline: 3px solid #bd7523; outline-offset: 4px; }
      @media (max-width: 480px) { main { margin-top: 48px; } section { padding: 24px; } }
    </style>
  </head>
  <body>
    <header><p>Tidepath Family Alliance</p></header>
    <main>
      <p class="label">Local prototype · Step 1</p>
      <h1>Counseling notes</h1>
      <p class="intro">Write each note once. Share only what the funder needs.</p>
      <section aria-labelledby="status-heading">
        <h2 id="status-heading">Scaffold ready</h2>
        <p>The local app is running. Note entry and funder reporting are not built yet.</p>
        <a href="/health">Check app status</a>
      </section>
    </main>
  </body>
</html>
